---
- hosts: all
  become: true
  gather_facts: true
  tasks:
  - name: install apt packages
    ansible.builtin.apt:
      name:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
      - gnupg
      - lsb-release
      - software-properties-common
      - python3
      - python3-pip
      - python3-venv
      - python3-setuptools
      - vim
      - neovim
      - ntp
      - net-tools
      force_apt_get: true
      state: latest
